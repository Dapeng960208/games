name: UI review image render
on:
  push:
    branches: [codex/ui-ab-high-fidelity-20261002]
    paths:
      - 'docs/ui-review-ab/source/**'
      - '.github/workflows/ui-review-render.yml'
permissions:
  contents: write
concurrency:
  group: ui-review-ab-render
  cancel-in-progress: true
jobs:
  render:
    if: github.ref == 'refs/heads/codex/ui-ab-high-fidelity-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-ab-high-fidelity-20261002
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Finalize reviewed layout
        run: python docs/ui-review-ab/finalize_once.py
      - name: Render review PNGs
        run: python docs/ui-review-ab/source/render.py
      - name: Commit only review assets
        shell: bash
        run: |
          git config user.name 'UI Review Renderer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ui-review-ab
          if ! git diff --cached --quiet; then
            git commit -m 'design: finalize 78 PNGs with consistent item badges and chapter scenery'
            git push origin HEAD:codex/ui-ab-high-fidelity-20261002
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: abyss-ui-review-pngs
          path: docs/ui-review-ab
          retention-days: 7
